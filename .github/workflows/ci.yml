name: React CI (Build Only)

on:
  push:
    branches:
      - '**'  # 모든 브랜치에서 동작

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build (no eslint fail)
        run: CI=false npm run build
